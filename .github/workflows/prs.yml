name: "PR Checks"

on:
  pull_request:
    branches:
      - master

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@3.2
        with:
          cli: latest
          lein: 2.9.6 # setting b/c latest 2.9.7 broke workflow

      - name: Install dependencies
        run: lein deps

      - name: Leinigen version
        run: lein -v

      - name: Test
        run: lein midje

      - name: Check generated API files are up to date
        if: success() || failure()
        run: |
          clojure -M:regen
          drift=$(git status --porcelain -- \
            src/tablecloth/column/api/operators.clj \
            src/tablecloth/api/operators.clj \
            src/tablecloth/column/api.clj \
            src/tablecloth/api.clj)
          if [ -n "$drift" ]; then
            stale=$(echo "$drift" | cut -c4-)
            for f in $stale; do
              echo "::error file=$f::$f is out of date. Run \`clojure -M:regen\` and commit the result."
            done
            {
              echo '### Generated API files are out of date'
              echo
              for f in $stale; do echo "- \`$f\`"; done
              echo
              echo 'Run `clojure -M:regen` and commit the result.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
